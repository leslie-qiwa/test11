<section id="contact" class="section-contact">
  <div class="inner">
    <h2>{{ .Site.Params.contactTitle | default "Get in Touch" }}</h2>
    <p>{{ .Site.Params.contactSubtitle | default "I'd love to hear from you." }}</p>
    {{ if .Site.Params.contactEmail }}
    <a href="mailto:{{ .Site.Params.contactEmail }}" class="btn">{{ .Site.Params.contactEmail }}</a>
    {{ end }}
  </div>
</section>
