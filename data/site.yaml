    role: "Year 9 Science Teacher"
  - quote: "I read the ed-tech reviews before trialling any new tool with my department now. The Padlet review in particular saved us from a very expensive mistake."
    author: "James Calloway"
    role: "Head of Digital Learning, Secondary School"
  - quote: "The collaborative activity pack transformed how my students work in groups. Structure was exactly what they needed — and what I needed to actually step back and observe."
