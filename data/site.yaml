rows:
  - title: "Interactive Learning Tools & Activities"
    paragraphs:
      - "The portfolio centres on one category: interactive learning tools and activities built for real classrooms. Quiz builders, flashcard systems, activity packs, and lesson frameworks — each project designed with both the teacher and the student in mind."
      - "Every piece of work here started with a genuine classroom problem. Browse the projects to see the thinking behind the solutions."
    emoji: "🛠️"
    ctaText: "View Portfolio"
    ctaUrl: "/portfolio/"
  - title: "Ed-Tech Tool Reviews — From the Blog"
    paragraphs:
      - "The blog focuses on ed-tech tool reviews: candid, hands-on assessments of the platforms and resources that land in educators' inboxes every year. No sponsorships, no affiliate links — just honest takes."
      - "The latest post covers the top tools tried this year, including Padlet, Canva for Education, Quizlet, Notion, and Google Classroom."
    emoji: "✍️"
    ctaText: "Read the Reviews"
    ctaUrl: "/blog/"

portfolio:
  category: "Interactive Learning Tools & Activities"
  intro: "A curated collection of tools and activities built to make education more engaging, accessible, and effective — for students and educators alike."
  items:
    - title: "Interactive Quiz Builder for Classroom Use"
      description: "A drag-and-drop quiz creation tool that lets teachers build formative assessments in minutes, with instant student feedback and completion tracking."
      url: "/portfolio/interactive-quiz-builder/"
      icon: "❓"
    - title: "Collaborative Learning Activity Pack"
      description: "A printable and digital toolkit of discussion cards, role frameworks, and reflection prompts for structured group learning in secondary classrooms."
      url: "/portfolio/collaborative-learning-activity-pack/"
      icon: "🤝"
    - title: "Adaptive Digital Flashcard System"
      description: "A spaced-repetition flashcard tool that schedules reviews based on student confidence — designed for independent learners preparing for assessments."
      url: "/portfolio/digital-flashcard-system/"
      icon: "🗂️"
    - title: "Lesson Plan Template Library"
      description: "Twenty editable lesson plan templates covering direct instruction, inquiry-based learning, flipped classroom, PBL, and differentiated instruction."
      url: "/portfolio/lesson-plan-template-library/"
      icon: "📋"

blog:
  focus: "Ed-Tech Tool Reviews"
  intro: "Honest, hands-on reviews of the education technology tools that teachers and students actually encounter — written from real classroom experience."
  posts:
    - title: "Top Ed-Tech Tools I've Tried This Year — Honest Reviews for Educators"
      date: "January 2025"
      description: "A candid review of Padlet, Canva for Education, Quizlet, Notion, and Google Classroom — what worked, what didn't, and what I'd recommend."
      url: "/blog/top-edtech-tools-honest-reviews/"
    - title: "Why Most Ed-Tech Fails Teachers (And What the Good Stuff Gets Right)"
      date: "November 2024"
      description: "The patterns behind why so many ed-tech tools underdeliver — and the principles that separate tools worth keeping from those that gather digital dust."
      url: "/blog/why-most-edtech-fails-teachers/"
    - title: "What I Learned Building an Interactive Learning Activity from Scratch"
      date: "August 2024"
      description: "The behind-the-scenes story of designing a classroom activity from a blank page — the decisions made, the mistakes, and what I'd do differently."
      url: "/blog/building-an-interactive-activity-from-scratch/"

testimonials:
  - quote: "The quiz builder alone saved me hours every week. It's the kind of tool that feels like it was made by someone who has actually stood in front of a classroom."
